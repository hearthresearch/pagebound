[project]
name = "pagebound"
version = "0.2.2"
description = "Shared PDF ingestion cache: structured markdown and JSON with page and bbox provenance, content-addressed and invalidated by hash."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "José Fernandes" }]
keywords = [
    "pdf-to-markdown", "docling", "zotero",
    "research-tools", "document-parsing", "provenance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["pypdfium2>=4.30.0,<6.0.0", "typer>=0.12.0"]

[project.optional-dependencies]
zotero = ["pyzotero>=1.14.0"]

[project.urls]
Homepage = "https://github.com/hearthresearch/pagebound"
Repository = "https://github.com/hearthresearch/pagebound"
Issues = "https://github.com/hearthresearch/pagebound/issues"

[project.scripts]
pagebound = "pagebound.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagebound"]

[dependency-groups]
# pyzotero is here as well so a checkout keeps the sync command working:
# `uv run` syncs groups, not extras.
dev = ["pytest>=8.0", "ruff>=0.6", "pyzotero>=1.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a real PDF and a working docling install"]
